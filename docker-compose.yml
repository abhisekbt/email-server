services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reconepal
    ports:
      - "5432:5432"
    volumes:
      - reconepal_postgres_data:/var/lib/postgresql/data

volumes:
  reconepal_postgres_data:
